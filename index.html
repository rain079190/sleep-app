<style>

html,body{margin:0;padding:0}
body{

/* sky */
.sky{position:fixed;inset:0;pointer-events:none;z-index:0;overflow:hidden}
.star{position:absolute;border-radius:50%;background:#fff;opacity:.2;animation:tw 4s ease-in-out infinite}
@keyframes tw{0%,100%{opacity:.15}50%{opacity:.9}}
.mist{position:absolute;width:140vw;height:40vh;left:-20vw;border-radius:50%;
  background:radial-gradient(ellipse at center,rgba(185,168,255,.10),rgba(185,168,255,0) 70%);filter:blur(10px);animation:drift 38s ease-in-out infinite alternate}

@keyframes drift{from{transform:translateX(-12vw)}to{transform:translateX(12vw)}}
@media (prefers-reduced-motion:reduce){.star,.mist,.play.playing::after{animation:none!important}}

.wrap{position:relative;z-index:1;max-width:520px;margin:0 auto;padding:0 16px calc(28px + env(safe-area-inset-bottom))}

.toast.show{opacity:1;transform:translate(-50%,0)}

<script>
(function(){
"use strict";
/* ---------- 声音定义 ---------- */
var ICONS={
  rain:'<path d="M7 15a4 4 0 0 1-.6-7.95A5.5 5.5 0 0 1 17 7.5a3.75 3.75 0 0 1 .5 7.5"/><path d="M9 17l-1 3M13 17l-1 3M17 17l-1 3"/>',
  ocean:'<path d="M2 10c2 0 2-2 4-2s2 2 4 2 2-2 4-2 2 2 4 2 2-2 4-2"/><path d="M2 15c2 0 2-2 4-2s2 2 4 2 2-2 4-2 2 2 4 2 2-2 4-2"/><path d="M2 20c2 0 2-2 4-2s2 2 4 2 2-2 4-2 2 2 4 2 2-2 4-2"/>',
  fire:'<path d="M12 3c1 3 5 5 5 10a5 5 0 0 1-10 0c0-2 1-3.5 2-4.5 0 2 1 3 2 3 0-3-1-5 1-8.5z"/><path d="M5 21h14"/>',
  wind:'<path d="M3 8h11a3 3 0 1 0-3-3"/><path d="M3 12h16a3 3 0 1 1-3 3"/><path d="M3 16h7"/>',
  noise:'<path d="M3 12h2M7 8v8M11 5v14M15 9v6M19 7v10M21 12h0"/>',
  crickets:'<path d="M20 14.5A8 8 0 1 1 9.5 4 6.5 6.5 0 0 0 20 14.5z"/><path d="M17 3v2M16 4h2M20 8v1.5M19.25 8.75h1.5"/>'
};
var SOUNDS=[
  {id:'rain',name:'雨声',desc:'窗外细雨'},
  {id:'ocean',name:'海浪',desc:'潮起潮落'},
  {id:'fire',name:'篝火',desc:'木柴噼啪'},
  {id:'wind',name:'风声',desc:'山间晚风'},
  {id:'noise',name:'白噪音',desc:'白 / 粉 / 棕',seg:true},
  {id:'crickets',name:'虫鸣',desc:'夏夜田野'}
];
var PRESETS=[
  {name:'雨夜篝火',mix:{rain:.65,fire:.5}},
  {name:'海边晚风',mix:{ocean:.7,wind:.3}},
  {name:'深度睡眠',mix:{noise:.5,rain:.35},noise:'brown'},
  {name:'山间夏夜',mix:{crickets:.45,wind:.3}},
  {name:'暴雨窗边',mix:{rain:.9,wind:.4}}
];
/* 每种声音的响度校准（使音量 100% 时各声音大致同样响） */
var CAL={rain:1.8,ocean:1.6,fire:1.3,wind:1.9,noise:1.1,crickets:1.2};

/* ---------- 状态 ---------- */
var state={playing:false,pausing:false,on:{},vol:{},noiseType:'pink'};
SOUNDS.forEach(function(s){state.on[s.id]=false;state.vol[s.id]=0.7;});
try{
  var saved=JSON.parse(localStorage.getItem('aoray-sleep')||'null');
  if(saved){
    for(var k in saved.vol) if(k in state.vol) state.vol[k]=+saved.vol[k];
    for(var k2 in saved.on) if(k2 in state.on) state.on[k2]=!!saved.on[k2];
    if(saved.noiseType) state.noiseType=saved.noiseType;
  }
}catch(e){}
function save(){try{localStorage.setItem('aoray-sleep',JSON.stringify({vol:state.vol,on:state.on,noiseType:state.noiseType}));}catch(e){}}

/* ---------- 音频引擎 ---------- */
var ctx=null,master=null,timerGain=null,chans={},built={},noiseSel=null;
var BUF={};

function rnd(){return Math.random();}
function mkBuf(ac,len){return ac.createBuffer(2,len,ac.sampleRate);}
function normRms(d,target){var s=0;for(var i=0;i<d.length;i++)s+=d[i]*d[i];var r=Math.sqrt(s/d.length)||1;var k=target/r;for(i=0;i<d.length;i++)d[i]*=k;}
function normPeak(d,target){var m=0;for(var i=0;i<d.length;i++){var a=Math.abs(d[i]);if(a>m)m=a;}m=m||1;var k=target/m;for(i=0;i<d.length;i++)d[i]*=k;}

function noiseBuf(ac,type){
  var key='n_'+type; if(BUF[key]) return BUF[key];
  var sr=ac.sampleRate,N=Math.floor(sr*8),F=Math.floor(sr*0.5),buf=mkBuf(ac,N-F);
  for(var ch=0;ch<2;ch++){
    var d=new Float32Array(N),i,w;
    if(type==='white'){for(i=0;i<N;i++)d[i]=rnd()*2-1;}
    else if(type==='pink'){
      var b0=0,b1=0,b2=0,b3=0,b4=0,b5=0,b6=0;
      for(i=0;i<N;i++){w=rnd()*2-1;
        b0=0.99886*b0+w*0.0555179;b1=0.99332*b1+w*0.0750759;b2=0.969*b2+w*0.153852;
        b3=0.8665*b3+w*0.3104856;b4=0.55*b4+w*0.5329522;b5=-0.7616*b5-w*0.016898;
        d[i]=b0+b1+b2+b3+b4+b5+b6+w*0.5362;b6=w*0.115926;}
    } else { /* brown */
      var l=0,mean=0;
      for(i=0;i<N;i++){w=rnd()*2-1;l=(l+0.02*w)/1.02;d[i]=l;mean+=l;}
      mean/=N;for(i=0;i<N;i++)d[i]-=mean;
    }
    for(i=0;i<F;i++){var t=i/F;d[i]=d[i]*Math.sqrt(t)+d[N-F+i]*Math.sqrt(1-t);} /* 无缝循环 */
    normRms(d,0.15);
    buf.getChannelData(ch).set(d.subarray(0,N-F));
  }
  return (BUF[key]=buf);
}
function hp1(d,a){var y=0,xp=0;for(var i=0;i<d.length;i++){var x=d[i];y=a*(y+x-xp);xp=x;d[i]=y;}}

function dropsBuf(ac){
  if(BUF.drops) return BUF.drops;
  var sr=ac.sampleRate,sec=12,N=sr*sec,buf=mkBuf(ac,N);
  for(var ch=0;ch<2;ch++){
    var d=new Float32Array(N),k,j;
    for(k=0;k<sec*55;k++){
      var t0=(rnd()*N)|0,amp=0.04+0.96*Math.pow(rnd(),3),tau=(0.3+rnd()*2.2)*sr/1000,len=(tau*6)|0;
      for(j=0;j<len;j++)d[(t0+j)%N]+=amp*(rnd()*2-1)*Math.exp(-j/tau);
    }
    for(k=0;k<sec*4;k++){ /* 屋檐滴答 */
      var p0=(rnd()*N)|0,f=1600+rnd()*2600,ta=(3+rnd()*9)*sr/1000,a2=0.05+0.18*rnd(),ln=(ta*6)|0;
      for(j=0;j<ln;j++)d[(p0+j)%N]+=a2*Math.sin(2*Math.PI*f*(1-0.15*j/ln)*j/sr)*Math.exp(-j/ta);
    }
    hp1(d,0.97);normPeak(d,0.9);
    buf.getChannelData(ch).set(d);
  }
  return (BUF.drops=buf);
}

function crackleBuf(ac){
  if(BUF.crackle) return BUF.crackle;
  var sr=ac.sampleRate,sec=20,N=sr*sec,buf=mkBuf(ac,N);
  var L=new Float32Array(N),R=new Float32Array(N);
  function click(pos,amp,tauMs,pan){
    var tau=tauMs*sr/1000,len=(tau*7)|0,s=(pos*sr)|0,gl=Math.cos((pan+1)*Math.PI/4),gr=Math.sin((pan+1)*Math.PI/4);
    for(var j=0;j<len;j++){var v=amp*(rnd()*2-1)*Math.exp(-j/tau),ix=(s+j)%N;L[ix]+=v*gl;R[ix]+=v*gr;}
  }
  var t=0;
  while(t<sec){
    t+=-Math.log(1-rnd())/6;
    var r=rnd(),pan=rnd()*0.9-0.45,m,i;
    if(r<0.68){m=1+((rnd()*3)|0);for(i=0;i<m;i++)click(t+rnd()*0.008,0.12+0.6*Math.pow(rnd(),2),0.2+rnd()*0.8,pan);}
    else if(r<0.94){var dur=0.03+rnd()*0.15;m=5+((rnd()*14)|0);for(i=0;i<m;i++)click(t+rnd()*dur,0.04+0.22*rnd(),0.1+rnd()*0.4,pan);}
    else{click(t,0.85+0.15*rnd(),2+rnd()*2.5,pan);for(i=0;i<4;i++)click(t+0.01+rnd()*0.08,0.1+0.3*rnd(),0.3+rnd()*0.6,pan);}
  }
  hp1(L,0.93);hp1(R,0.93);
  var m2=0;for(var q=0;q<N;q++)m2=Math.max(m2,Math.abs(L[q]),Math.abs(R[q]));
  for(q=0;q<N;q++){L[q]*=0.95/m2;R[q]*=0.95/m2;}
  buf.getChannelData(0).set(L);buf.getChannelData(1).set(R);
  return (BUF.crackle=buf);
}

function cricketBuf(ac){
  if(BUF.crickets) return BUF.crickets;
  var sr=ac.sampleRate,sec=10,N=sr*sec,buf=mkBuf(ac,N);
  var L=new Float32Array(N),R=new Float32Array(N);
  var bugs=[{f:4300,p:0.78,pan:-0.55,a:1},{f:4750,p:0.97,pan:0.5,a:0.7},{f:5150,p:0.63,pan:0.1,a:0.4},{f:3900,p:1.3,pan:-0.1,a:0.3}];
  bugs.forEach(function(b){
    var gl=Math.cos((b.pan+1)*Math.PI/4),gr=Math.sin((b.pan+1)*Math.PI/4),t=rnd()*b.p;
    while(t<sec-0.25){
      if(rnd()>0.08){
        var pulses=3+((rnd()*2)|0);
        for(var p=0;p<pulses;p++){
          var s=((t+p*0.034)*sr)|0,len=(0.021*sr)|0;
          for(var j=0;j<len;j++){var e=Math.sin(Math.PI*j/len);e*=e;
            var v=b.a*e*(Math.sin(2*Math.PI*b.f*(s+j)/sr)+0.15*Math.sin(4*Math.PI*b.f*(s+j)/sr));
            L[s+j]+=v*gl;R[s+j]+=v*gr;}
        }
      }
      t+=b.p*(0.92+0.16*rnd());
    }
  });
  var m=0;for(var q=0;q<N;q++)m=Math.max(m,Math.abs(L[q]),Math.abs(R[q]));
  for(q=0;q<N;q++){L[q]*=0.8/m;R[q]*=0.8/m;}
  buf.getChannelData(0).set(L);buf.getChannelData(1).set(R);
  return (BUF.crickets=buf);
}

/* 小工具 */
function G(ac,v){var g=ac.createGain();g.gain.value=v;return g;}
function F(ac,type,f,q){var b=ac.createBiquadFilter();b.type=type;b.frequency.value=f;if(q!=null)b.Q.value=q;return b;}
function SRC(ac,buf){var s=ac.createBufferSource();s.buffer=buf;s.loop=true;s.start(0,rnd()*buf.duration*0.9);return s;}
function OSC(ac,hz){var o=ac.createOscillator();o.frequency.value=hz;o.start();return o;}
function MOD(ac,osc,depth,param){var g=G(ac,depth);osc.connect(g);g.connect(param);}
function chain(){for(var i=0;i<arguments.length-1;i++)arguments[i].connect(arguments[i+1]);return arguments[arguments.length-1];}

var BUILD={
  rain:function(ac,out){
    var g1=G(ac,0.55);chain(SRC(ac,noiseBuf(ac,'pink')),F(ac,'highpass',250,0.5),F(ac,'lowpass',6500,0.5),g1,out);
    MOD(ac,OSC(ac,0.06),0.12,g1.gain);
    chain(SRC(ac,noiseBuf(ac,'white')),F(ac,'bandpass',3200,0.6),G(ac,0.14),out);
    chain(SRC(ac,dropsBuf(ac)),F(ac,'lowpass',9000,0.7),G(ac,0.7),out);
  },
  ocean:function(ac,out){
    var lp=F(ac,'lowpass',520,0.7),wg=G(ac,0.5);chain(SRC(ac,noiseBuf(ac,'brown')),lp,wg,out);
    var o1=OSC(ac,1/10),o2=OSC(ac,1/16.7);
    MOD(ac,o1,380,lp.frequency);MOD(ac,o2,140,lp.frequency);MOD(ac,o1,0.38,wg.gain);MOD(ac,o2,0.1,wg.gain);
    var fg=G(ac,0.05);chain(SRC(ac,noiseBuf(ac,'white')),F(ac,'highpass',1800,0.5),F(ac,'lowpass',7000,0.5),fg,out);
    MOD(ac,o1,0.048,fg.gain);
    chain(SRC(ac,noiseBuf(ac,'brown')),F(ac,'lowpass',140,0.5),G(ac,0.3),out);
  },
  fire:function(ac,out){
    var r=G(ac,0.5);chain(SRC(ac,noiseBuf(ac,'brown')),F(ac,'lowpass',350,0.5),r,out);
    MOD(ac,OSC(ac,0.23),0.15,r.gain);MOD(ac,OSC(ac,0.71),0.08,r.gain);
    chain(SRC(ac,noiseBuf(ac,'pink')),F(ac,'bandpass',1500,0.6),G(ac,0.05),out);
    chain(SRC(ac,crackleBuf(ac)),F(ac,'highpass',400,0.5),G(ac,0.9),out);
  },
  wind:function(ac,out){
    var o1=OSC(ac,0.05),o2=OSC(ac,0.13);
    var bp=F(ac,'bandpass',480,1.2),wg=G(ac,0.6);chain(SRC(ac,noiseBuf(ac,'pink')),bp,wg,out);
    MOD(ac,o1,260,bp.frequency);MOD(ac,o2,90,bp.frequency);MOD(ac,o1,0.35,wg.gain);MOD(ac,o2,0.15,wg.gain);
    var bp2=F(ac,'bandpass',950,7),w2=G(ac,0.35);chain(SRC(ac,noiseBuf(ac,'white')),bp2,w2,out);
    MOD(ac,o1,420,bp2.frequency);MOD(ac,o2,0.2,w2.gain);
    var b=G(ac,0.35);chain(SRC(ac,noiseBuf(ac,'brown')),F(ac,'lowpass',220,0.5),b,out);MOD(ac,o1,0.2,b.gain);
  },
  noise:function(ac,out,type){
    var gs={};
    var lv={white:0.45,pink:0.7,brown:1};
    ['white','pink','brown'].forEach(function(t){
      var g=G(ac,t===type?lv[t]:0);
      var src=SRC(ac,noiseBuf(ac,t));
      if(t==='white') chain(src,F(ac,'lowpass',9000,0.5),g,out); else chain(src,g,out);
      gs[t]=g;
    });
    return function(nt){var now=ac.currentTime;for(var k in gs){gs[k].gain.setTargetAtTime(k===nt?lv[k]:0,now,0.25);}};
  },
  crickets:function(ac,out){
    chain(SRC(ac,cricketBuf(ac)),F(ac,'lowpass',8000,0.5),G(ac,0.5),out);
    chain(SRC(ac,noiseBuf(ac,'brown')),F(ac,'lowpass',300,0.5),G(ac,0.12),out);
  }
};

function ensureCtx(){
  if(ctx) return ctx;
  var AC=window.AudioContext||window.webkitAudioContext;
  try{ctx=new AC({latencyHint:'playback'});}catch(e){ctx=new AC();}
  var lim=ctx.createDynamicsCompressor();
  lim.threshold.value=-10;lim.knee.value=6;lim.ratio.value=12;lim.attack.value=0.005;lim.release.value=0.25;
  master=G(ctx,0);timerGain=G(ctx,1);
  chain(master,timerGain,lim,ctx.destination);
  ctx.onstatechange=function(){
    if(ctx.state!=='running'&&state.playing&&!state.pausing){state.playing=false;render();}
  };
  return ctx;
}
function chanTarget(id){return state.on[id]?state.vol[id]*state.vol[id]*(CAL[id]||1):0;}
function applyChan(id){
  if(!ctx) return;
  if(state.on[id]&&!built[id]){
    chans[id]=G(ctx,0);chans[id].connect(master);
    var r=BUILD[id](ctx,chans[id],state.noiseType);
    if(id==='noise') noiseSel=r;
    built[id]=true;
  }
  if(chans[id]) chans[id].gain.setTargetAtTime(chanTarget(id),ctx.currentTime,0.3);
}

/* iOS：静音开关下也能出声 + 锁屏媒体信息 */
var silentEl=null;
function unlockIOS(){
  try{if(navigator.audioSession) navigator.audioSession.type='playback';}catch(e){}
  if(silentEl) return;
  try{
    var sr=8000,n=sr,ab=new ArrayBuffer(44+n*2),v=new DataView(ab);
    function ws(o,s){for(var i=0;i<s.length;i++)v.setUint8(o+i,s.charCodeAt(i));}
    ws(0,'RIFF');v.setUint32(4,36+n*2,true);ws(8,'WAVE');ws(12,'fmt ');v.setUint32(16,16,true);v.setUint16(20,1,true);
    v.setUint16(22,1,true);v.setUint32(24,sr,true);v.setUint32(28,sr*2,true);v.setUint16(32,2,true);v.setUint16(34,16,true);
    ws(36,'data');v.setUint32(40,n*2,true);
    silentEl=document.createElement('audio');silentEl.setAttribute('playsinline','');silentEl.loop=true;
    silentEl.src=URL.createObjectURL(new Blob([ab],{type:'audio/wav'}));
  }catch(e){silentEl=null;}
}
function setupMediaSession(){
  if(!('mediaSession' in navigator)) return;
  try{
    navigator.mediaSession.metadata=new MediaMetadata({title:'助眠声音',artist:'Ao Ray · 每日治愈风景',
      artwork:[{src:'logo.png',sizes:'256x256',type:'image/png'}]});
    navigator.mediaSession.setActionHandler('play',function(){play();});
    navigator.mediaSession.setActionHandler('pause',function(){pause();});
  }catch(e){}
}

function play(){
  ensureCtx();unlockIOS();
  if(!SOUNDS.some(function(s){return state.on[s.id];})){state.on.rain=true;}
  state.playing=true;state.pausing=false;
  SOUNDS.forEach(function(s){applyChan(s.id);});
  if(silentEl){var p=silentEl.play();if(p&&p.catch)p.catch(function(){});}
  var r=ctx.resume();if(r&&r.catch)r.catch(function(){});
  master.gain.cancelScheduledValues(ctx.currentTime);master.gain.setTargetAtTime(1,ctx.currentTime,0.4);
  try{navigator.mediaSession.playbackState='playing';}catch(e){}
  save();render();
}
function pause(fromTimer){
  if(!ctx) return;
  state.playing=false;state.pausing=true;
  master.gain.cancelScheduledValues(ctx.currentTime);
  master.gain.setTargetAtTime(0,ctx.currentTime,fromTimer?0.05:0.15);
  if(silentEl) silentEl.pause();
  setTimeout(function(){
    if(!state.playing){ctx.suspend().then(function(){
      state.pausing=false;
      if(fromTimer){timerGain.gain.cancelScheduledValues(0);timerGain.gain.setValueAtTime(1,ctx.currentTime);}
    },function(){state.pausing=false;});}
    else state.pausing=false;
  },fromTimer?250:900);
  try{navigator.mediaSession.playbackState='paused';}catch(e){}
  render();
}

/* ---------- 定时 ---------- */
var timer={min:0,endAt:0,fade:0};
function setTimer(min){
  ensureCtx();
  var tg=timerGain.gain,now=ctx.currentTime;
  tg.cancelScheduledValues(0);tg.setValueAtTime(1,now);
  timer.min=min;
  if(min){
    var total=min*60;timer.fade=Math.min(90,total*0.15);timer.endAt=now+total;
    var curve=new Float32Array(128);
    for(var i=0;i<128;i++){var c=Math.cos(i/127*Math.PI/2);curve[i]=c*c;}
    tg.setValueCurveAtTime(curve,timer.endAt-timer.fade,timer.fade);
    toast('已设定 '+min+' 分钟后渐渐停止');
  }else{timer.endAt=0;}
  render();tick();
}
function fmt(s){s=Math.max(0,Math.ceil(s));var m=Math.floor(s/60),x=s%60;return (m<10?'0':'')+m+':'+(x<10?'0':'')+x;}
var cdEl=document.getElementById('countdown');
function tick(){
  if(!timer.endAt||!ctx){cdEl.textContent='';return;}
  var rem=timer.endAt-ctx.currentTime;
  if(rem<=0){
    timer.endAt=0;timer.min=0;cdEl.textContent='';
    if(state.playing) pause(true);
    else{timerGain.gain.cancelScheduledValues(0);timerGain.gain.setValueAtTime(1,ctx.currentTime);}
    render();toast('晚安，好梦 🌙');return;
  }
  var txt=fmt(rem)+(rem<=timer.fade?' · 渐弱中':'')+(state.playing?'':' · 已暂停');
  cdEl.textContent=txt;
}
setInterval(tick,500);
document.addEventListener('visibilitychange',function(){if(!document.hidden){tick();render();}});

/* ---------- 界面 ---------- */
function $(id){return document.getElementById(id);}
var grid=$('grid');
SOUNDS.forEach(function(s){
  var el=document.createElement('div');el.className='card';el.id='card-'+s.id;
  el.innerHTML='<button class="toggle" aria-pressed="false"><span class="ico"><svg viewBox="0 0 24 24">'+ICONS[s.id]+'</svg></span>'+
    '<span><div class="tname">'+s.name+'</div><div class="tdesc">'+s.desc+'</div></span></button>'+
    (s.seg?'<div class="seg"><button data-t="white">白</button><button data-t="pink">粉</button><button data-t="brown">棕</button></div>':'')+
    '<input type="range" min="0" max="100" step="1" aria-label="'+s.name+'音量">';
  grid.appendChild(el);
  var rg=el.querySelector('input');rg.value=Math.round(state.vol[s.id]*100);rg.style.setProperty('--p',rg.value+'%');
  rg.addEventListener('input',function(){
    state.vol[s.id]=rg.value/100;rg.style.setProperty('--p',rg.value+'%');applyChan(s.id);save();
  });
  el.querySelector('.toggle').addEventListener('click',function(){
    state.on[s.id]=!state.on[s.id];
    if(state.on[s.id]&&!state.playing){play();}
    else{applyChan(s.id);
      if(state.playing&&!SOUNDS.some(function(x){return state.on[x.id];})) pause();}
    save();render();
  });
  if(s.seg){
    el.querySelectorAll('.seg button').forEach(function(b){
      b.addEventListener('click',function(){
        state.noiseType=b.dataset.t;
        if(noiseSel) noiseSel(state.noiseType);
        if(!state.on.noise){state.on.noise=true;if(!state.playing)play();else applyChan('noise');}
        save();render();
      });
    });
  }
});
var pr=$('presets');
PRESETS.forEach(function(p){
  var b=document.createElement('button');b.className='chip';b.textContent=p.name;
  b.addEventListener('click',function(){
    SOUNDS.forEach(function(s){
      state.on[s.id]=s.id in p.mix;
      if(s.id in p.mix){state.vol[s.id]=p.mix[s.id];var rg=$('card-'+s.id).querySelector('input');rg.value=Math.round(p.mix[s.id]*100);rg.style.setProperty('--p',rg.value+'%');}
    });
    if(p.noise){state.noiseType=p.noise;if(noiseSel)noiseSel(p.noise);}
    if(!state.playing) play(); else SOUNDS.forEach(function(s){applyChan(s.id);});
    toast('场景：'+p.name);save();render();
  });
  pr.appendChild(b);
});
$('playBtn').addEventListener('click',function(){state.playing?pause():play();});
$('timerChips').querySelectorAll('.chip').forEach(function(b){
  b.addEventListener('click',function(){setTimer(+b.dataset.min);});
});

function render(){
  var names=SOUNDS.filter(function(s){return state.on[s.id];}).map(function(s){return s.id==='noise'?({white:'白噪音',pink:'粉红噪音',brown:'棕色噪音'})[state.noiseType]:s.name;});
  SOUNDS.forEach(function(s){
    var el=$('card-'+s.id);el.classList.toggle('on',state.on[s.id]);
    el.querySelector('.toggle').setAttribute('aria-pressed',state.on[s.id]?'true':'false');
    if(s.seg) el.querySelectorAll('.seg button').forEach(function(b){b.classList.toggle('active',b.dataset.t===state.noiseType);});
  });
  var pb=$('playBtn');pb.classList.toggle('playing',state.playing);
  pb.setAttribute('aria-label',state.playing?'暂停':'播放');
  $('playIcon').innerHTML=state.playing?'<path d="M7 5h3.5v14H7zM13.5 5H17v14h-3.5z"/>':'<path d="M8 5.5v13l11-6.5z"/>';
  $('stTitle').textContent=state.playing?'正在播放':'轻触播放，开始放松';
  $('stSub').textContent=names.length?(state.playing?'':'已选：')+names.join(' · '):'选择喜欢的声音，可同时混合多种';
  $('timerChips').querySelectorAll('.chip').forEach(function(b){b.classList.toggle('active',+b.dataset.min===timer.min);});
}
var toastT;
function toast(msg){var t=$('toast');t.textContent=msg;t.classList.add('show');clearTimeout(toastT);toastT=setTimeout(function(){t.classList.remove('show');},2200);}

/* 星空 */
(function(){
  var sky=$('sky'),n=window.innerWidth<600?55:90;
  for(var i=0;i<n;i++){
    var s=document.createElement('i');s.className='star';var z=Math.random()*1.8+0.6;
    s.style.cssText='left:'+(Math.random()*100)+'%;top:'+(Math.random()*70)+'%;width:'+z+'px;height:'+z+'px;animation-delay:'+(-Math.random()*6)+'s;animation-duration:'+(3+Math.random()*5)+'s';
    sky.appendChild(s);
  }
})();
setupMediaSession();
render();

/* 供测试/校准使用 */
window.__sleep={state:state,BUILD:BUILD,CAL:CAL,getCtx:function(){return ctx;},timer:timer,setTimer:setTimer};
})();
</script>
